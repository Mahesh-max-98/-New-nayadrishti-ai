name: NayaDrishti free external news scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayadrishti-scheduled-news-check
  cancel-in-progress: false

jobs:
  scheduled-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger NayaDrishti during Nepal daytime
        env:
          NAYADRISHTI_URL: https://nayadrishti-ai.onrender.com
          SCHEDULER_SHARED_SECRET: ${{ secrets.SCHEDULER_SHARED_SECRET }}
        run: python - <<'PY'
          import os
          import sys
          from datetime import datetime
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Kathmandu"))
          if not (5 <= now.hour <= 22 and (now.hour < 22 or now.minute <= 55)):
              print(f"Outside NayaDrishti schedule: {now.isoformat()}")
              sys.exit(0)

          secret = os.environ.get("SCHEDULER_SHARED_SECRET", "").strip()
          if not secret:
              print("Missing GitHub Actions secret SCHEDULER_SHARED_SECRET", file=sys.stderr)
              sys.exit(1)

          url = os.environ["NAYADRISHTI_URL"].rstrip("/") + "/scheduled-check"
          request = Request(url, data=b"{}", headers={
              "Authorization": "Bearer " + secret,
              "Content-Type": "application/json",
              "User-Agent": "NayaDrishti-GitHub-Actions-Scheduler/1.0",
          }, method="POST")
          try:
              with urlopen(request, timeout=110) as response:
                  print(f"NayaDrishti scheduler response: HTTP {response.status}")
                  print(response.read(1000).decode("utf-8", errors="replace"))
          except HTTPError as exc:
              print(f"NayaDrishti returned HTTP {exc.code}: {exc.read(1000).decode('utf-8', errors='replace')}", file=sys.stderr)
              sys.exit(1)
          except (URLError, TimeoutError) as exc:
              print(f"NayaDrishti could not be reached: {exc}", file=sys.stderr)
              sys.exit(1)
          PY
