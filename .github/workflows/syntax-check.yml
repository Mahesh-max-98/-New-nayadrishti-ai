name: Python syntax check

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application modules
        run: python -m compileall -q app.py image_generator.py news_monitor.py google_research.py database.py
      - name: Check Image Studio template
        run: test -s templates/image_studio.html
