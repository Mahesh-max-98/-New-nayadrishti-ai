name: Python syntax check

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile text-only application modules
        run: python -m compileall -q app.py ai_writer.py news_monitor.py database.py facebook_publisher.py worker.py
      - name: Verify image features are removed
        run: test ! -e image_generator.py && test ! -e google_research.py && test ! -e templates/image_studio.html
