name: Phase 18 Facebook reliability tests

on:
  pull_request:
    paths:
      - "app.py"
      - "database.py"
      - "facebook_publisher.py"
      - "news_monitor.py"
      - "tests/**"
      - ".github/workflows/phase18-tests.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "database.py"
      - "facebook_publisher.py"
      - "news_monitor.py"
      - "tests/**"
      - ".github/workflows/phase18-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run test suite
        run: pytest -q
