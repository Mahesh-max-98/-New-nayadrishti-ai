services:
  - type: web
    name: nayadrishti-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter

  - type: worker
    name: nayadrishti-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    plan: starter
